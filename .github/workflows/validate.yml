# The two checks the HACS default store requires: HACS's own validation and
# Home Assistant's hassfest. They run on the PUBLIC MIRROR (this folder is
# copied there by tools/publish_ha_integration.sh). The brand images live in
# custom_components/thewashguide/brand/ (the post-2026.3 mechanism; the old
# home-assistant/brands PR route is closed to custom integrations), which is
# what the HACS action's brands check reads.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
