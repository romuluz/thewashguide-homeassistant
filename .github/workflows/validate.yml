# The two checks the HACS default store requires: HACS's own validation and
# Home Assistant's hassfest. They run on the PUBLIC MIRROR (this folder is
# copied there by tools/publish_ha_integration.sh); the HACS action's brands
# check stays red until the home-assistant/brands PR for `thewashguide` is
# merged, and that is expected, not a defect here.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
